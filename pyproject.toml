[project]
name = "askdata-mini"
version = "0.1.0"
description = "教学版智能问数 Agent：数据字典、检索、IR、固定流水线与工具 Agent、评测"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "jieba>=0.42.1",
]

[project.scripts]
askdata = "askdata.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["askdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
